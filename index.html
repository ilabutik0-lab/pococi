<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; background: #000; }
        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; cursor: pointer;
            background: #ff4d4d; color: white; border: none; border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5); z-index: 100;
        }
    </style>
</head>
<body>

    <button id="startBtn">ЗАПУСТИТЬ</button>

    <!-- МУЗЫКА -->
    <audio id="mySong">
        <source src="Пососи.mp3" type="audio/mpeg">
        <!-- Резервная ссылка, чтобы проверить звук, если твой файл не сработает -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <canvas id="c"></canvas>

    <script>
        console.log("Скрипт загружен");

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('startBtn');
        const audio = document.getElementById('mySong');

        let width, height;
        let particles = [];
        let state = 'IDLE'; 
        let beatFactor = 1;
        let textAlpha = 0;
        const words = ["卍"];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            console.log("Размер экрана:", width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.txt = words[Math.floor(Math.random() * words.length)];
                this.color = "white";
                this.targetX = width/2;
                this.targetY = height/2;
                this.delay = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.font = "bold 16px Arial";
                ctx.fillText(this.txt, this.x, this.y);
            }

            update() {
                if (state === 'GATHER') {
                    this.x += (width/2 - this.x) * 0.12;
                    this.y += (height/2 - this.y) * 0.12;
                } 
                else if (state === 'EXPLODE') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                }
                else if (state === 'HEART' || state === 'BEATING') {
                    if (this.delay > 0) {
                        this.delay--;
                        this.x += this.vx;
                        this.y += this.vy;
                    } else {
                        let tx = this.targetX;
                        let ty = this.targetY;
                        
                        if (state === 'BEATING') {
                            let dx = this.originX - width/2;
                            let dy = this.originY - height/2;
                            tx = width/2 + dx * beatFactor;
                            ty = height/2 + dy * beatFactor;
                        }

                        this.x += (tx - this.x) * 0.08;
                        this.y += (ty - this.y) * 0.08;
                        this.color = "#ff3355";
                    }
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
            }
        }

        function init() {
            particles = [];
            for(let i=0; i<350; i++) {
                particles.push(new Particle());
            }
            console.log("Частицы созданы:", particles.length);
        }

        btn.addEventListener('click', () => {
            console.log("Кнопка нажата");
            btn.style.display = 'none';
            state = 'GATHER';

            // Пытаемся включить музыку
            audio.play().then(() => {
                console.log("Музыка играет");
            }).catch(e => {
                console.log("Ошибка аудио (возможно, файл не найден):", e);
            });

            // 1. Через 0.6 сек — Взрыв
            setTimeout(() => {
                console.log("Старт взрыва");
                state = 'EXPLODE';
                particles.forEach(p => {
                    let ang = Math.random() * Math.PI * 2;
                    let spd = Math.random() * 25 + 10;
                    p.vx = Math.cos(ang) * spd;
                    p.vy = Math.sin(ang) * spd;
                });

                // 2. Через 0.8 сек — Сборка сердца
                setTimeout(() => {
                    console.log("Старт сборки сердца");
                    state = 'HEART';
                    let count = particles.length;
                    let scale = Math.min(width, height) / 45;
                    
                    // Создаем точки сердца
                    let points = [];
                    for (let i = 0; i < count; i++) {
                        let t = Math.PI * 2 * (i / count);
                        let x = 16 * Math.pow(Math.sin(t), 3);
                        let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        points.push({x: width/2 + x * scale, y: height/2 + y * scale, ox: x});
                    }
                    // Сортировка слева направо по координате X
                    points.sort((a, b) => a.ox - b.ox);

                    particles.forEach((p, i) => {
                        p.targetX = points[i].x;
                        p.targetY = points[i].y;
                        p.originX = points[i].x;
p.originY = points[i].y;
                        p.delay = i * 0.5; 
                    });

                    // 3. Через 3 сек — Пульсация и текст
                    setTimeout(() => {
                        console.log("Старт пульсации");
                        state = 'BEATING';
                    }, 3000);

                }, 800);
            }, 600);
        });

        function loop() {
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(0, 0, width, height);

            if (state === 'BEATING') {
                beatFactor = 1 + Math.pow(Math.abs(Math.sin(Date.now() * 0.005)), 10) * 0.15;
                if (textAlpha < 1) textAlpha += 0.01;
                
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = `rgba(255,255,255,${textAlpha})`;
                ctx.font = `bold ${35 * beatFactor}px Arial`;
                ctx.fillText("ПОСОСИ", width/2, height/2);
                ctx.restore();
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
