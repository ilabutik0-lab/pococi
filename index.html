<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Animation Project</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; background: #000; }
        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; cursor: pointer;
            background: #ff4d4d; color: white; border: none; border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5); z-index: 100;
            transition: 0.3s;
        }
        #startBtn:hover { background: #ff1a1a; transform: translate(-50%, -50%) scale(1.1); }
    </style>
</head>
<body>

    <button id="startBtn">ЗАПУСТИТЬ</button>

    <audio id="mySong">
        <source src="Пососи.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('startBtn');
        const audio = document.getElementById('mySong');

        let width, height;
        let particles = [];
        let state = 'IDLE'; 
        let beatFactor = 1;
        const words = ["卍"];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Генерация точек для формы символа
        function getShapePoints() {
            const points = [];
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = width;
            tempCanvas.height = height;
            
            tCtx.textAlign = "center";
            tCtx.textBaseline = "middle";
            tCtx.font = `bold ${Math.min(width, height) * 0.7}px Arial`;
            tCtx.fillText("卍", width/2, height/2);

            const data = tCtx.getImageData(0, 0, width, height).data;
            for (let y = 0; y < height; y += 10) {
                for (let x = 0; x < width; x += 10) {
                    if (data[(y * width + x) * 4 + 3] > 128) {
                        points.push({x, y});
                    }
                }
            }
                        return points;
        }

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.txt = words[Math.floor(Math.random() * words.length)];
                this.color = "white";
                this.targetX = this.x;
                this.targetY = this.y;
                this.originX = this.x;
                this.originY = this.y;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.font = "16px Arial";
                ctx.fillText(this.txt, this.x, this.y);
            }

            update() {
                if (state === 'GATHER') {
                    this.x += (width/2 - this.x) * 0.1;
                    this.y += (height/2 - this.y) * 0.1;
                } 
                else if (state === 'EXPLODE') {
                    this.x += this.vx * 15;
                    this.y += this.vy * 15;
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                }
                else if (state === 'FORM' || state === 'BEATING') {
                    let tx = this.targetX;
                    let ty = this.targetY;

                    if (state === 'BEATING') {
                        let dx = this.targetX - width/2;
                        let dy = this.targetY - height/2;
                        tx = width/2 + dx * beatFactor;
                        ty = height/2 + dy * beatFactor;
                    }

                    this.x += (tx - this.x) * 0.08;
                    this.y += (ty - this.y) * 0.08;
                    this.color = "#ff3355";
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
            }
        }

        function createParticles() {
            particles = [];
            const shapePoints = getShapePoints();
            for(let i = 0; i < 600; i++) {
                const p = new Particle();
                const target = shapePoints[i % shapePoints.length];
                p.targetX = target.x;
                p.targetY = target.y;
                particles.push(p);
            }
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, width, height);

            if (state === 'BEATING') {
                beatFactor = 1 + Math.sin(Date.now() * 0.01) * 0.15;
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        btn.onclick = () => {
            btn.style.display = 'none';
            audio.play();
            
            state = 'GATHER';
            
            setTimeout(() => { state = 'EXPLODE'; }, 1500);
            setTimeout(() => { state = 'FORM'; }, 3000);
            setTimeout(() => { state = 'BEATING'; }, 5000);
        };

        createParticles();
        animate();
    </script>
</body>
</html>
